          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: -Wl,-Bstatic
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: -Wl,-Bstatic
            language-c: gnu99
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-size
            signed-char: true
            warnings: all-warnings
          global:
            abi: ilp32
            arch: rv32imac
            code-model: medlow
            misc-control:
              - -msave-restore
              - -fmessage-length=0
              - -fno-common
              - -Wunused
              - -Wuninitialized
            output-debug-info: enable
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: -nostartfiles --specs=nano.specs --specs=nosys.specs
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
    uploadConfigMap:
